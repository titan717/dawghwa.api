# Categories for GitHub's generated release notes.
# Every merged PR gets exactly one of these labels (see docs/RELEASE.md).
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - docs
    - title: Maintenance
      labels:
        - chore
    - title: Other changes
      labels:
        - "*"
