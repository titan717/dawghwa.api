name: Source Health Report

on:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Probes run in-process against the sources themselves; no hosted API is used.
      - name: Generate docs/SOURCE_STATUS.md
        run: npm run health:report
      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/SOURCE_STATUS.md docs/source-status.json
          git diff --staged --quiet || git commit -m "chore: update source status report [skip ci]"
          git push
