name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Check source manifest is up to date
        run: |
          node scripts/generate-source-manifest.mjs
          git diff --exit-code src/lib/providers/manifest.generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
